name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify toolchain against source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Verify checked-in contracts
        run: |
          python3 tools/pc-migration/prepare-assets.py --output app/src/main/assets
          python3 tools/prepare-destructive-policy.py --check
          python3 tools/prepare-runtime-tools.py --check
          python3 tools/verify-runtime-descriptor-source.py --source-only
          python3 tools/generate-third-party-notices.py --check
          python3 tools/check-third-party-notices.py
          python3 tools/generate-builtin-plugins.py --verify
          python3 tools/generate-credential-paths.py --check
          python3 tools/prepare-semver-reference.py
          python3 tools/format-java-tree.py --check
          python3 tools/run-host-tests.py --check-manifest
          python3 tools/check-source-hygiene.py
          python3 tools/check-ui-i18n.py
      - name: Isolated source and protocol regressions
        run: python3 tools/run-host-tests.py --stage fast
      - name: Android Java and both flavor unit tests without offline package generation
        run: |
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          bash tools/ci-sdkmanager.sh "platforms;$platform" "build-tools;$buildtools"
          chmod +x gradlew
          # preBuild gates the build on generated offline inputs: bxroot natives (verifyBxrootNative /
          # verifyBxrootProjection rebuild them from lock and compare bytes) and the runtime descriptor
          # (prepareRuntimeDescriptor needs dsh-runtime.bin / offline-rootfs.bin / ubuntu-tools.bin).
          # A clean clone has none of them, and this job's contract is "unit tests without offline
          # package generation" — so they are excluded here and stay enforced in ci-package, which
          # restores the exact inputs. Step 6 still verifies the descriptor source-only, and
          # tools/run-host-tests.py --stage fast still runs the archive-free regressions.
          if ! ./gradlew :app:testStandardDebugUnitTest :app:testLowDebugUnitTest \
              -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets \
              -x :app:verifyBxrootNative -x :app:verifyBxrootProjection \
              -x :app:prepareRuntimeDescriptor -x :app:verifyRuntimeDescriptorInputs \
              --no-daemon --max-workers=2; then
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          failed = []
          for report in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      failed.append((case.get('classname', '') + '.' + case.get('name', ''), ' '.join((bad.get('message') or '').split())[:300]))
          for name, message in failed[:20]:
              print('::error title=' + name + '::' + message.replace('%', '%25'))
          print('::error title=Gradle unit tests::' + (str(len(failed)) + ' failing test cases (first 20 annotated)' if failed else 'build failed outside unit test reports'))
          PY
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && (hashFiles('app/build/host-tests/**', 'app/build/test-results/**') != '')
        with:
          name: source-regressions
          path: |
            app/build/host-tests
            app/build/test-results
          if-no-files-found: error
          retention-days: 14
